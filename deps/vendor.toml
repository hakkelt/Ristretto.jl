[[AbstractOperators.stack]]
branch = "feat/accumulating-mul"
parent = "perf/operator-pool"
pr = "hakkelt/AbstractOperators.jl#42"

# HCAT, Sum, the VCAT adjoint, BroadCast and the Jacobians add their blocks through `add_mul!`
