# `unified-threading` owns the FFTW size policy, and its PR is open against the real upstream, so
# the policy's own bugfix cannot be another commit there -- hence a branch of its own, stacked on
# it, which is what rule 1 above means by "code that no existing branch owns" in practice.
[[AbstractOperators.stack]]
branch = "fix/fftw-thread-gate-planner-flags"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#25"

# MIN_BATCH_WORK_FOR_PARALLEL was never measured (its own docstring called it "provisional");
# swept and raised to its real crossover. unified-threading owns threading_policy.jl and is
# frozen (open against the real upstream), so this is a branch of its own stacked on it, same
# reasoning as the FFTW gate fix above.
[[AbstractOperators.stack]]
branch = "fix/batch-op-threading-threshold"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#26"

# `BroadCast`'s kernels and its threading threshold, both owned by `unified-threading`, which is
# frozen; a branch of its own stacked on it, same reasoning as the two above. Needs the
# `quiesce_foreign_pools` entry point that NestedThreading's `perf/quiesce-foreign-pools` adds,
# so the vendored copy only loads against a NestedThreading checkout that carries it.
[[AbstractOperators.stack]]
branch = "perf/threads-native-kernels"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#27"

# A large `MatrixOp`/`LMatrixOp` `gemm` grants itself BLAS's threads past a caller's soft
# default. Needs NestedThreading's `perf/thread-grants` (0.1.2). Stacked on `unified-threading`,
# which owns `threading_policy.jl` and is frozen.
[[AbstractOperators.stack]]
branch = "perf/blas-flop-grant"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#45"

# The DFT's normalization pass threads with its plan (FastBroadcast), instead of staying a
# serial full-array pass behind a threaded FFT. `unified-threading` owns the DFT's threading and
# is frozen, so this is a branch of its own stacked on it.
[[AbstractOperators.stack]]
branch = "perf/dft-threaded-scaling"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#46"

# Sign alternations standing in for shifts, and what the FFTW combination rules build, keep the
# threading of the operators they replace instead of the constructors' `threaded = true`. The
# `threaded` flag they ignored comes from the frozen `unified-threading`.
[[AbstractOperators.stack]]
branch = "fix/shift-combine-threading"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#47"

# `AffineOperator` and `is_affine`; `is_linear` holds only for truly linear operators, so an
# `AffineAdd` and anything built from one is affine but not linear. Needs OperatorCore 0.1.2.
[[AbstractOperators.stack]]
branch = "feat/affine-operator"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#48"

# `displacement` of a linear operator returns zero instead of applying the operator to zeros,
# which a strict `is_linear` makes one check. Also removes `MyLinOp`, a `LinearOperator` around
# an unchecked user function.
[[AbstractOperators.stack]]
branch = "perf/linear-displacement"
parent = "feat/affine-operator"
pr = "hakkelt/AbstractOperators.jl#49"

# Runs of pointwise operators in a `Compose` (diagonals, masks, broadcasts and their adjoints,
# the DFT's normalization) execute as one loop. Its threaded loop parks Polyester's workers
# first, which `perf/threads-native-kernels` introduced, so it is stacked on that branch.
[[AbstractOperators.stack]]
branch = "perf/fused-pointwise"
parent = "perf/threads-native-kernels"
pr = "hakkelt/AbstractOperators.jl#50"

# The 2-D and 3-D filter-bank wavelet transforms split each stage's lines across threads.
[[AbstractOperators.stack]]
branch = "perf/wavelet-threads"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#51"

# The Toeplitz normal operator of an `NFFTOp` plans its FFT with the NFFT plan's own planner rigor
# instead of always `ESTIMATE`. `unified-threading` owns the code and is frozen.
[[AbstractOperators.stack]]
branch = "perf/nfft-planner-flags"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#52"

# `is_AAc_diagonal`/`is_AcA_diagonal` of a `MatrixOp` reject on a sample of row (column) pairs
