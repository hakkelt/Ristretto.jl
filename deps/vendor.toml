[[AbstractOperators.stack]]
branch = "perf/matrixop-gram-diagonal-sample"
parent = "gpu-safe-operator-metadata"
pr = "hakkelt/AbstractOperators.jl#53"

# The Toeplitz normal operator of a device `NFFTOp` is planned with the device's own FFT and NFFT
# plans (`NFFTOperatorsGPUArraysExt`). `unified-threading` owns the code and is frozen.
[[AbstractOperators.stack]]
branch = "feat/gpu-nfft-toeplitz"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#31"

# A device `NFFTOp`'s plan and Toeplitz kernel are computed on the device instead of the host.
[[AbstractOperators.stack]]
branch = "perf/gpu-nfft-device-plan"
parent = "feat/gpu-nfft-toeplitz"
pr = "hakkelt/AbstractOperators.jl#34"

# `NFFTOp` over a stack (`dims`, `nframe`): on a device the NFFT of a coil x frame stack is one
