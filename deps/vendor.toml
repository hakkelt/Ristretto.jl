[StructuredOptimization]
fork = "https://github.com/hakkelt/StructuredOptimization.jl.git"
upstream = "https://github.com/JuliaFirstOrder/StructuredOptimization.jl.git"
base = "upstream/master"
prefix = "deps/StructuredOptimization"
prune = [
    "test", "docs", "benchmark", "benchmarks", "demos", "ext", ".github", ".claude",
    "AGENTS.md", "CLAUDE.md", "Manifest.toml", "codecov.yml",
]

# One branch, not three: `fix/normalop-ls-multivar` and `phase-0-2-consolidation` were merged into
# the fork's `master` as one linear history (no merge commits), so the whole of Ristretto's
# StructuredOptimization work lives there. Both old branches are still on the fork, fully contained
# in `master`, and `check` reports them as unreferenced until they are deleted.
#
# No PR: JuliaFirstOrder/StructuredOptimization.jl#44 was closed deliberately, so this branch is
# untracked work upstream until it is re-proposed, which is what `check` says about it.
[[StructuredOptimization.stack]]
branch = "master"
parent = ""
pr = ""

# Solver selection by a parse that builds nothing, so a solve forms one normal operator.
[[StructuredOptimization.stack]]
branch = "perf/single-normal-op"
parent = "master"
pr = "hakkelt/StructuredOptimization.jl#4"

