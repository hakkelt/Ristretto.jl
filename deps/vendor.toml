# Manifest of the vendored dependency stack.
#
# Ristretto vendors work-in-progress versions of its dependency stack under `deps/` because a Julia
# package cannot be registered with unregistered dependencies. Every vendored package is a
# projection of a stack of branches in a personal fork, each of which is (or will become) a small
# PR against the real upstream. This file is the single place that records which branches make up
# that projection and how they are stacked, so that `deps/vendor.jl` can rebuild `deps/`
# mechanically and can check the stack against what GitHub actually says.
#
# Per package:
#   fork      remote URL of the personal fork; its `integration` branch is what gets vendored
#   upstream  remote URL of the real upstream
#   base      ref the integration branch is rebuilt from, in the local checkout's remote names
#   prefix    where the package is vendored inside this repository
#   prune     globs deleted from the vendored copy after every sync: everything Ristretto does not
#             compile. A vendored package's tests, docs, benchmarks and CI belong to the fork and
#             run there. `ext/` cannot load at all for a package included as a submodule, so an
#             extension is either inlined into `src/` by the patch, pruned, or -- the GPU
#             extensions -- kept and `include`d by Ristretto's own `RistrettoGPUExt`,
#             which is why those `ext/` entries name what is dropped rather than the directory.
#
# Then one `[[<package>.stack]]` entry per branch, in merge order: a branch always appears after
# the branch it is stacked on. `parent` is the branch this one is based on, empty for a branch
# that sits directly on `base`; it is the PR base that the stack intends, which `deps/vendor.jl
# check` compares against the base GitHub reports. Branches may be stacked freely -- stacking is
# how the stack avoids a permanent rebase treadmill, not a defect.
#
# Two rules govern edits to this file:
#
#  1. A branch is a unit of review, not a unit of work. Do not add a branch for a bugfix; push the
#     fix to the branch whose PR introduced the code, and it reaches `deps/` on the next sync. A
#     new entry is for a new idea, or for code that no existing branch owns.
#  2. `deps/` is generated output. Bugs found while developing Ristretto are fixed on the owning branch
#     and re-vendored, never edited in place under `deps/`.
#
# When a branch's PR merges upstream, delete its entry, re-fetch `base`, and rebuild: everything
# stacked above it moves onto the new root in one go.
#
# Where a fork is checked out is a property of one machine, not of the stack, so it is deliberately
# absent here and lives in `deps/vendor.local.toml` instead -- untracked, one
# `<Package> = "/path/to/checkout"` line per checkout that exists locally. A package with no entry
# there is simply not checked out on this machine; `check` still reports everything GitHub can
# answer for it, while `rebuild`, `patch` and `sync` say which entry they need. Nothing tracked in
# this repository, and nothing pushed to a fork, may name a path of one machine.

# The fork is the upstream: OperatorCore is the user's own package. It is vendored because Ristretto
# needs `is_affine` before a release has it.
[OperatorCore]
fork = "https://github.com/hakkelt/OperatorCore.jl.git"
upstream = "https://github.com/hakkelt/OperatorCore.jl.git"
base = "upstream/master"
prefix = "deps/OperatorCore"
prune = [".github", ".claude", "Manifest.toml", "test", "docs"]

# `is_affine`, and `is_linear` documented as excluding a displacement.
[[OperatorCore.stack]]
branch = "feat/is-affine"
parent = ""
pr = "hakkelt/OperatorCore.jl#2"

# NFFT.jl is a monorepo: AbstractNFFTs, NFFTTools and the wrappers are packages of their own and
# stay registered dependencies, so only the `NFFT` package at its root is vendored, with its GPU
# extension, which Ristretto's `RistrettoGPUExt` includes.
[NFFT]
fork = "https://github.com/hakkelt/NFFT.jl.git"
upstream = "https://github.com/JuliaMath/NFFT.jl.git"
base = "upstream/master"
prefix = "deps/NFFT"
prune = [
    "AbstractNFFTs", "NFFTTools", "CuNFFT", "Wrappers",
    "test", "docs", "benchmark", ".github", "NFFT.bib", "Manifest.toml",
]

# GPU plans that transform a stack of arrays (coils x frames) at once, with interpolation tables
# built on the device and no host synchronization per transform.
[[NFFT.stack]]
branch = "perf/gpu-batched-plan"
parent = ""
pr = "hakkelt/NFFT.jl#1"

# NFFT3.jl no longer precompiles on current Julia; the test target, the wrapper and the benchmarks
# stop depending on it.
[[NFFT.stack]]
branch = "chore/drop-nfft3"
parent = ""
pr = "hakkelt/NFFT.jl#2"

# Nothing in the package uses Distributed; loading it costs every dependent about 400 ms.
[[NFFT.stack]]
branch = "chore/drop-distributed"
parent = ""
pr = "hakkelt/NFFT.jl#3"

