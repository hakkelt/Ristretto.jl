[[AbstractOperators.stack]]
branch = "perf/combinators-accumulate"
parent = "feat/accumulating-mul"
pr = "hakkelt/AbstractOperators.jl#43"

# The test environment accepts JET 0.12, the series for Julia 1.13; 0.11 reports runtime dispatch
# on every `op.field .= x`. The compat line is upstream's, so no branch owns it. Test-only: the
# vendored copy does not change.
[[AbstractOperators.stack]]
branch = "test/jet-0.12"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#44"

# Docs only (pruned from the vendored copy): the fork deploys its `integration` docs to its own
# GitHub Pages, which Ristretto's documentation links to.
[[AbstractOperators.stack]]
branch = "docs/fork-pages"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#55"

