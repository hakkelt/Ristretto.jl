[[AbstractOperators.stack]]
branch = "perf/gpu-nfft-batched"
parent = "perf/gpu-nfft-device-plan"
pr = "hakkelt/AbstractOperators.jl#35"

# Fused pointwise runs of a `Compose` on device arrays, one kernel per run.
[[AbstractOperators.stack]]
branch = "perf/gpu-fused-pointwise"
parent = "perf/fused-pointwise"
pr = "hakkelt/AbstractOperators.jl#36"

# `remove_displacement` of an `OperatorWrapper` keeps the device storage it reports, so a
# host-only operator wrapped for a device reconstruction survives the solver's rebuild.
[[AbstractOperators.stack]]
branch = "fix/operator-wrapper-storage"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#32"

# A device `GetIndex` keeps the arrays of its index tuple on the device, instead of uploading and
# bounds-checking them on every application.
[[AbstractOperators.stack]]
branch = "fix/gpu-getindex-device-indices"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#33"

# The normal operator of a copying spreading `BatchOp` maps over its per-thread operator arrays.
[[AbstractOperators.stack]]
branch = "fix/spreading-copying-normal-op"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#37"

# A batch with fewer items than threads leaves the threads to a wrapped operator that threads itself.
[[AbstractOperators.stack]]
branch = "perf/batch-inner-threads"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#38"

# GetIndex's codomain steps over N axes for a vector of CartesianIndex{N}.
[[AbstractOperators.stack]]
branch = "fix/getindex-cartesian-dim-out"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#39"

# FiniteDiff's kernels difference contiguous row ranges of a (pre * n, post) view, so a short
# leading dimension no longer makes the innermost loop short. `unified-threading` owns the
# threaded kernels and is frozen.
[[AbstractOperators.stack]]
branch = "perf/finitediff-slab-kernels"
parent = "unified-threading"
pr = "hakkelt/AbstractOperators.jl#40"

# HigherOrderDiff, the order-K forward difference in one pass, which chained FiniteDiffs along
# one direction combine into. Reuses the slab layout of the branch below it.
[[AbstractOperators.stack]]
branch = "feat/higher-order-diff"
parent = "perf/finitediff-slab-kernels"
pr = "hakkelt/AbstractOperators.jl#41"

# VCAT's adjoint sums its blocks through `add_mul!`, which GetIndex specialises. Rebased onto
# `feat/higher-order-diff` (from `fix/compose-getindex-multivar`) so the accumulating `mul!`
# below can build on it, the slab kernels and the pool in one line of descent.
[[AbstractOperators.stack]]
branch = "perf/vcat-additive-adjoint"
parent = "feat/higher-order-diff"
pr = "hakkelt/AbstractOperators.jl#22"

# OperatorPool: operators built one after another reuse Compose buffers and DFT plans. Touches
# Compose and the DFT constructor, both owned by the frozen `unified-threading`. Rebased onto
# `perf/vcat-additive-adjoint` for the same reason.
[[AbstractOperators.stack]]
branch = "perf/operator-pool"
parent = "perf/vcat-additive-adjoint"
pr = "hakkelt/AbstractOperators.jl#54"

# LinearAlgebra's 5-argument `mul!(y, L, x, α, β)` for every operator: one pass for the
