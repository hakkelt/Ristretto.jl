config-version = 1

# deps/ vendors upstream package sources (AbstractOperators, StructuredOptimization,
# ProximalOperators, ProximalAlgorithms) for the fixes and additions Ristretto currently depends on.
# Their own test suites are not part of Ristretto's test run — they use those packages' own test
# environments (not Ristretto's test/Project.toml), and would otherwise be picked up by
# `@run_package_tests`'s package-root scan. Since the vendored copies are pruned to what Ristretto
# compiles, deps/ no longer carries test files at all, but the exclusion stays as a guard.
#
# .vendor-work/ holds the scratch worktrees in which `deps/vendor.jl rebuild` assembles each
# fork's `integration` branch. Those are full checkouts of the dependency repositories, test
# suites included, and a package-root scan finds every one of them.
#
# .claude/ holds agent worktrees, which are whole copies of this repository — their test items
# are this suite's own, collected a second and third time, in a checkout whose `deps/` is a
# different vintage.
exclude = ["deps/", ".vendor-work/", ".claude/"]
