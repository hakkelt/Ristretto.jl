name: Cache keep-alive

# GitHub drops a cache entry that no run has read for 7 days. Restoring master's executed
# tutorial pages and tutorial datasets twice a week keeps them for the next pull request, which
# would otherwise execute every tutorial again (about 20 minutes) and download the datasets.
# The restore keys and paths must match documentation.yml, or the lookup finds nothing.

on:
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: docs/src/tutorials
          key: docs-tutorials-${{ runner.os }}-keepalive
          restore-keys: docs-tutorials-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.julia/scratchspaces/b3f1a2c4-5d6e-4a7b-9c8d-0e1f2a3b4c5d
          key: mritestdata-${{ runner.os }}-v1
